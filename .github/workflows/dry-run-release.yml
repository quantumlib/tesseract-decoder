name: Dry Run Releasing Tesseract

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create_version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Create version
        run: |
          mkdir version
          echo "$(python _version.py).dev$(date '+%Y%m%d%H%M%S')" > version/version.txt
          cat version/version.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: version-file
          path: version

  build_wheels:
    runs-on: ${{ matrix.os }}
    needs: [create_version]
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
        python-version: ['3.12', '3.13', '3.14']
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: version-file
        path: version

    - name: Set up Bazel
      uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}-${{ matrix.os }}-py${{ matrix.python-version }}
        repository-cache: true

    - name: Set Python Version
      env:
        TARGET_PYTHON: ${{ matrix.python-version }}
      run: |
        echo "set version to ${TARGET_PYTHON}"
        python _update_bazel_py_version.py $TARGET_PYTHON

    - name: Build package
      env:
        TARGET_PYTHON: ${{ matrix.python-version }}
      run: |
        glibc_version=$(ldd --version | awk '/ldd/{print $NF}')
        export GLIBC_VERSION="${glibc_version//./_}"
        echo $GLIBC_VERSION
        sed "s/^MANYLINUX_VERSION.*/MANYLINUX_VERSION=\"manylinux_${GLIBC_VERSION}_$(uname -m)\"/" BUILD -i || true
        ABI_TAG="$(python -c "print(\"cp${TARGET_PYTHON}\".replace(\".\", \"\"))")"
        echo $ABI_TAG
        bazel build --config=wheel --define ABI_TAG=$ABI_TAG --define GLIBC_VERSION=$GLIBC_VERSION --define TARGET_VERSION="$(python -c "print(\"py${TARGET_PYTHON}\".replace(\".\", \"\"))")" --define VERSION="$(cat version/version.txt)"  :tesseract_decoder_wheel

    - name: Smoke-test wheel
      run: |
        pip install ./bazel-bin/*.whl
        # Run outside the source tree to import the installed wheel.
        cd "$RUNNER_TEMP"
        python - <<'EOF'
        import numpy as np
        import stim
        from tesseract_decoder import tesseract

        circuit = stim.Circuit.generated(
            "surface_code:rotated_memory_x",
            distance=3,
            rounds=3,
            after_clifford_depolarization=0.001,
        )
        dem = circuit.detector_error_model()
        decoder = tesseract.TesseractConfig(dem=dem, det_beam=50).compile_decoder()
        dets, obs = circuit.compile_detector_sampler(seed=0).sample(
            1000, separate_observables=True
        )
        predictions = decoder.decode_batch(dets)
        errors = np.count_nonzero(np.any(predictions != obs, axis=1))
        print(f"{errors} logical errors in 1000 shots")
        assert errors < 20
        EOF

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: python-wheels-${{ matrix.os }}-${{ matrix.python-version }}
        path: ./bazel-bin/*.whl


  release-wheels:
    name: Publish all wheels
    needs: [build_wheels]
    runs-on: ubuntu-24.04

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: python-wheels-*
        merge-multiple: true
        path: wheelhouse/

    - name: Test Wheels
      run: |
        pip install build twine
        twine check wheelhouse/*

    # - name: Publish package to testpypi
    #   uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
    #   with:
    #     repository-url: https://test.pypi.org/legacy/
    #     user: __token__
    #     password: ${{ secrets.TEST_PYPI_TOKEN }}
    #     packages-dir: wheelhouse/
    #     verbose: true

